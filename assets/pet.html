<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harness Pet</title>
<style>
  @font-face { font-family: "Silkscreen"; font-weight: 700; src: url(fonts/silkscreen-700.woff2) format("woff2"); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  #basket, #bunny { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
  #basket { z-index: 3; }
  #cat, .pop { position: absolute; left: 0; top: 0; will-change: transform; }
  #cat { cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #cat.hop #flip { animation: hop .5s steps(7); }
  #cat.alert #flip { animation: hop .6s steps(7) 3; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } }

  /* pixel-style pop-ups: square corners, hard shadow, square tail */
  .pop {
    padding: 6px 10px; font: 700 12px/1.4 "Silkscreen", "Cascadia Mono", Consolas, monospace;
    background: #f4f6fb; color: #262a36; border: 3px solid #262a36; box-shadow: 4px 4px 0 rgba(38,42,54,.55);
  }
  .pop[hidden], #prompt[hidden] { display: none; }
  .pop::after { content: ""; position: absolute; left: var(--tail, 50%); width: 9px; height: 9px; margin-left: -6px;
    background: #f4f6fb; border: 3px solid #262a36; border-top: 0; border-left: 0; bottom: -11px; }
  .pop.below::after { bottom: auto; top: -11px; transform: rotate(180deg); }
  #bubble { max-width: 280px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow: visible; }
  #prompt { width: 340px; display: flex; flex-direction: column; gap: 6px; }
  #prompt label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  #prompt select, #prompt input {
    font: inherit; color: inherit; background: #fff; border: 2px solid #262a36; border-radius: 0; padding: 4px 6px; min-width: 0; outline: none;
  }
  #prompt select { flex: 1; }
  #prompt input:focus, #prompt select:focus { border-color: #4a84fe; box-shadow: 0 0 0 2px #cfe0ff; }
  #prompt .hint { font-size: 11px; font-weight: 400; opacity: .7; }
  #prompt .empty { font-weight: 400; }
  @media (prefers-reduced-motion: reduce) { #cat.hop #flip, #cat.alert #flip { animation: none; } }
</style>
</head>
<body>
<div id="bubble" class="pop" hidden role="status" aria-live="polite"></div>
<form id="prompt" class="pop" hidden aria-label="Neuer Prompt">
  <label>Prompt an <select id="target" aria-label="Ziel-Session"></select></label>
  <input id="text" type="text" autocomplete="off" spellcheck="false" placeholder="Neuer Prompt …" aria-label="Prompt" />
  <span class="hint">Enter sendet · Esc schließt</span>
  <span class="empty" id="empty" hidden>Keine laufende Session.</span>
</form>
<div id="tip" class="pop" hidden role="tooltip"></div>
<div id="bunny" hidden><canvas id="bunnyc"></canvas></div>
<div id="cat" aria-label="Harness-Katze"><div id="flip" style="width:100%;height:100%"><canvas id="sprite" width="32" height="24"></canvas></div></div>
<div id="basket"><canvas id="basketc"></canvas></div>
<script src="catFrames.js"></script>
<script>
  // ---- sprite: assets/catFrames.js (generated by scripts/make-cat.py), 32x24, faces right
  const { w: CW, h: CH, frames: FRAMES } = CAT;

  // props: draw a prop frame (rows of any width) into its own canvas, scaled by S.scale
  function paintProp(el, name, pal) {
    const rows = FRAMES[name], c = el.querySelector("canvas") || el;
    c.width = rows[0].length; c.height = rows.length;
    c.style.width = c.width * S.scale + "px"; c.style.height = c.height * S.scale + "px";
    const g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height);
    rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  }
  // one visiting animal (settings.companion): speed px/s, frame length ms, hop height / flutter in sprite px
  const MOVES = { bunny: { v: 70, ms: 260, hop: 3 }, mouse: { v: 120, ms: 110, hop: 0 }, bird: { v: 60, ms: 300, hop: 2 }, butterfly: { v: 45, ms: 160, hop: 0, fly: 10 } };
  const PROP = { y: "#ffd24a", c: "#ff9a3c", o: "#2b2d3a", w: "#f4f1ec", g: "#cdc6bd", e: "#2b2d3a", p: "#f2a7b5", n: "#e8758c", u: "#8a5a2b", r: "#c68a4a" };

  const mix = (hex, to, t) => {
    const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
    const c = (s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
    return "#" + [16, 8, 0].map((s) => c(s).toString(16).padStart(2, "0")).join("");
  };

  // ---- state
  const $ = (id) => document.getElementById(id);
  const tip = $("tip"), cat = $("cat"), flip = $("flip"), bubble = $("bubble"), prompt = $("prompt"), canvas = $("sprite"), ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  let S = null, PAL = {}, W = 120, H = 80;
  let x = 0, y = 0, dir = 1, mode = "rest", tx = 0, ty = 0, restUntil = 0, bubbleUntil = 0, pending = 0, promptOpen = false;
  let napPending = false, bunnyOn = false, bunnyLast = performance.now(), bunnyX = 0, bunnyDir = 1, bunnyStart = 0, bunnyNext = performance.now() + 15000, bunnyFrame = "";
  let groomUntil = 0, sleepUntil = 0, groomAt = performance.now() + 6000, hoverCat = false, tipNext = 0, running = 0;
  let last = performance.now(), lastKey = "", blinkUntil = 0, nextBlink = last + 2500;

  const area = () => (reduced.matches ? "sit" : S.area);
  const maxX = () => Math.max(0, innerWidth - W);
  const floorY = () => Math.max(0, innerHeight - H);
  const basketX = () => Math.max(0, maxX() - 24 * (S?.scale ?? 4) - 8);
  const basketW = () => FRAMES.basket[0].length * S.scale, basketH = () => FRAMES.basket.length * S.scale;
  const anchorX = () => ({ left: 12, center: maxX() / 2, right: maxX() - 12 })[S.anchor];

  function applySettings(next) {
    const firstTime = !S;
    S = next;
    PAL = { o: S.outline, w: S.fur, g: mix(S.fur, "#000000", 0.16), e: S.eyes, h: "#ffffff", p: "#f2a7b5", n: "#e8758c", c: "#ff7a1a", y: "#ffd24a", t: "#ff6f8a", k: "#ffe08a", z: "#8fb8ff" };
    W = CW * S.scale; H = CH * S.scale;
    cat.style.width = W + "px"; cat.style.height = H + "px";
    lastKey = "";
    paintProp($("basket"), "basket", PROP); bunnyOn = false; $("bunny").hidden = true; bunnyFrame = "";
    if (firstTime) { x = anchorX(); y = floorY(); }
    clamp();
    if (area() === "sit") { x = anchorX(); y = floorY(); mode = "rest"; }
    else if (area() === "floor") y = floorY();
    pickTarget(true);
  }

  function clamp() { x = Math.min(Math.max(0, x), maxX()); y = Math.min(Math.max(0, y), floorY()); }

  function pickTarget(soon) {
    if (area() === "sit") { mode = "rest"; restUntil = Infinity; return; }
    tx = Math.random() * maxX();
    ty = area() === "screen" && Math.random() < 0.45 ? Math.random() * floorY() : floorY();
    mode = "rest";
    restUntil = performance.now() + (soon ? 600 : 2000 + Math.random() * 4000);
  }

  function holding() { return promptOpen || bubbleUntil > 0; }

  // ---- draw
  function draw(name) {
    ctx.clearRect(0, 0, CW, CH);
    FRAMES[name].forEach((row, yy) => [...row].forEach((c, xx) => {
      if (c === ".") return;
      ctx.fillStyle = PAL[c];
      ctx.fillRect(xx, yy, 1, 1);
    }));
  }

  function place(el, preferAbove, centerX, edgeY, gap) {
    const w = el.offsetWidth, h = el.offsetHeight;
    const left = Math.min(Math.max(4, centerX - w / 2), Math.max(4, innerWidth - w - 8));
    const above = edgeY.top - h - gap >= 4 || !preferAbove;
    const top = above ? edgeY.top - h - gap : edgeY.bottom + gap;
    el.classList.toggle("below", !above);
    el.style.setProperty("--tail", Math.min(Math.max(14, centerX - left), w - 14) + "px");
    el.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
  }

  function tick(t) {
    const dt = Math.min(0.1, (t - last) / 1000);
    last = t;
    if (S) {
      if (!holding() && mode === "walk") {
        const dx = tx - x, dy = ty - y, dist = Math.hypot(dx, dy), step = S.speed * dt;
        if (dist <= step) { x = tx; y = ty; mode = "rest"; restUntil = t + 2000 + Math.random() * 4000; }
        else { x += (dx / dist) * step; y += (dy / dist) * step; if (Math.abs(dx) > 1) dir = dx < 0 ? -1 : 1; }
      } else if (!holding() && mode === "rest" && t > restUntil && !groomUntil && !sleepUntil) {
        mode = "walk";
      }
      if (bubbleUntil && t > bubbleUntil) dismiss();
      if (t > nextBlink) { blinkUntil = t + 140; nextBlink = t + 2500 + Math.random() * 3000; }

      const stepMs = Math.min(400, Math.max(80, 10400 / S.speed));
      if (napPending && mode === "rest" && Math.abs(x - (basketX() + (basketW() - W) / 2)) < 2) { napPending = false; sleepUntil = t + 9000; dir = -1; }
      if (holding() || reduced.matches) { groomUntil = sleepUntil = 0; napPending = false; }
      else if (mode !== "rest") groomUntil = sleepUntil = 0;
      if (!groomUntil && !sleepUntil && t > groomAt) {
        // idle: mostly groom, sometimes nap (only when no session is running)
        if (!running && Math.random() < 0.4) { napPending = true; tx = basketX() + (basketW() - W) / 2; ty = floorY(); mode = "walk"; } else groomUntil = t + 4500;
        groomAt = t + 10000 + Math.random() * 10000;
      }
      if (t > groomUntil) groomUntil = 0;
      if (t > sleepUntil) sleepUntil = 0;
      const wag = Math.floor(t / 700) % 3 === 0 ? "Tail" : "";
      const name = mode === "walk" && !holding() ? (Math.floor(t / stepMs) % 2 ? "walkB" : "walkA")
        : groomUntil ? (Math.floor(t / 320) % 2 ? "groomB" : "groomA")
        : sleepUntil ? "sleep" : hoverCat ? "sitBlink" : "sit" + wag;
      const blinking = name.startsWith("sit") && !name.endsWith("Blink") && t < blinkUntil;
      const key = name + blinking;
      if (key !== lastKey) { draw(blinking ? name + "Blink" : name); lastKey = key; }

      // basket sits on the floor line; bunny hops by now and then
      const bk = $("basket"), fy = Math.round(floorY() + H - basketH());
      bk.style.transform = `translate(${Math.round(basketX() / S.scale) * S.scale}px, ${fy}px)`;
      updateBunny(t);
      flip.style.transform = dir < 0 ? "scaleX(-1)" : "none";
      const sink = sleepUntil ? 5 * S.scale : 0; // nap: the cat settles behind the basket rim
      const sx = Math.round(x / S.scale) * S.scale, sy = Math.round(y / S.scale) * S.scale + sink; // snap to the sprite pixel grid: no shimmer between frames
      cat.style.transform = `translate(${sx}px, ${sy}px)`;
      const edge = { top: sy, bottom: sy + H }, cx = sx + W / 2;
      if (!bubble.hidden) place(bubble, true, cx, edge, 12);
      if (!prompt.hidden) place(prompt, true, cx, edge, 12);
      const showTip = hoverCat && !holding();
      if (showTip && t > tipNext) { tipNext = t + 1000; refreshTip(); }
      tip.hidden = !showTip;
      if (showTip) place(tip, true, cx, edge, 12);
    }
    requestAnimationFrame(tick);
  }

  // ---- bunny: crosses the floor every 40-80s; the cat sits up and watches it
  function updateBunny(t) {
    const b = $("bunny"), dt = Math.min(0.1, (t - bunnyLast) / 1000), m = MOVES[S.companion];
    bunnyLast = t;
    if (!m || reduced.matches) { b.hidden = true; bunnyOn = false; return; }
    if (!bunnyOn) {
      if (t < bunnyNext) return;
      bunnyOn = true; bunnyDir = Math.random() < 0.5 ? 1 : -1; bunnyX = bunnyDir > 0 ? -60 : innerWidth + 60; bunnyStart = t;
    }
    bunnyX += bunnyDir * m.v * dt;
    if (bunnyX < -80 || bunnyX > innerWidth + 80) { bunnyOn = false; b.hidden = true; bunnyNext = t + 40000 + Math.random() * 40000; return; }
    b.hidden = false;
    const second = ((t - bunnyStart) / m.ms) % 2 > 1, name = S.companion + (second ? "B" : "A");
    if (bunnyFrame !== name) { bunnyFrame = name; paintProp(b, name, PROP); }
    const bh = FRAMES[name].length * S.scale;
    const lift = (second ? m.hop : 0) * S.scale + (m.fly ? (m.fly + 4 * Math.sin(t / 400)) * S.scale : 0);
    b.style.transform = `translate(${Math.round(bunnyX / S.scale) * S.scale}px, ${Math.round(floorY() + H - bh - lift)}px)${bunnyDir < 0 ? " scaleX(-1)" : ""}`;
    // the cat watches: stop grooming/napping and look at the visitor while it is on screen
    if (mode === "rest" && !holding() && !napPending) { dir = bunnyX > x ? 1 : -1; groomUntil = sleepUntil = 0; groomAt = t + 6000; }
  }

  // ---- hover status: what the cat is doing + how many sessions are running
  async function refreshTip() {
    try { running = (await window.pet.sessions()).sessions.length; } catch { /* keep last count */ }
    const doing = sleepUntil ? "Schläft · Zzz" : groomUntil ? "Putzt sich" : mode === "walk" ? "Streunt umher" : "Sitzt und wartet";
    tip.textContent = `${doing} · ${running ? `${running} Session${running > 1 ? "s" : ""} aktiv` : "Keine Session aktiv"}`;
  }

  // ---- bubble
  function say(text, seconds) {
    bubble.textContent = text;
    bubble.hidden = false;
    bubbleUntil = performance.now() + (seconds ?? S.bubbleSeconds) * 1000;
  }
  function notify(text) {
    if (!S) return;
    if (promptOpen) closePrompt();
    pending = bubbleUntil ? pending + 1 : 0;
    say(text + (pending ? `  (+${pending})` : ""));
    mode = "rest";
    cat.classList.remove("alert"); void cat.offsetWidth; cat.classList.add("alert");
    setTimeout(() => cat.classList.remove("alert"), 1900);
  }
  function dismiss() {
    bubbleUntil = 0; pending = 0; bubble.hidden = true;
    restUntil = performance.now() + 800;
  }

  // ---- prompt
  async function openPrompt() {
    const { sessions, target } = await window.pet.sessions();
    const sel = $("target"), input = $("text");
    sel.replaceChildren(...sessions.map((s) => Object.assign(new Option(s.projectName ? `${s.name} · ${s.projectName}` : s.name, s.id), { selected: s.id === target })));
    const none = sessions.length === 0;
    $("empty").hidden = !none;
    sel.parentElement.hidden = input.hidden = prompt.querySelector(".hint").hidden = none;
    if (!bubble.hidden) dismiss();
    promptOpen = true; mode = "rest";
    prompt.hidden = false;
    window.pet.focusable(true);
    setTimeout(() => input.focus(), 60);
  }
  function closePrompt() {
    if (!promptOpen) return;
    promptOpen = false; prompt.hidden = true; $("text").value = "";
    window.pet.focusable(false);
    restUntil = performance.now() + 800;
  }
  prompt.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("text").value.trim(), id = $("target").value, name = $("target").selectedOptions[0]?.text.split(" · ")[0];
    if (!text || !id) return;
    const res = await window.pet.send(id, text);
    closePrompt();
    say(res.ok ? `Gesendet an ${name}` : "Konnte nicht senden", 4);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePrompt(); });
  window.addEventListener("blur", () => closePrompt());

  // ---- mouse: the window is click-through, only the cat and its pop-ups catch the pointer
  let over = false;
  const inside = (el, e) => { if (el.hidden) return false; const r = el.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
  const setOver = (v) => { if (v !== over) { over = v; window.pet.hover(v); } };
  document.addEventListener("mousemove", (e) => {
    const onCat = inside(cat, e);
    if (onCat && !hoverCat) tipNext = 0;
    hoverCat = onCat;
    setOver(onCat || inside(bubble, e) || inside(prompt, e));
  });
  document.addEventListener("mouseleave", () => { hoverCat = false; setOver(false); });

  // click = prompt box, double-click = open the project
  let clickTimer = 0;
  cat.addEventListener("click", () => {
    if (clickTimer) {
      clearTimeout(clickTimer); clickTimer = 0;
      closePrompt();
      window.pet.openSession();
      cat.classList.remove("hop"); void cat.offsetWidth; cat.classList.add("hop");
      setTimeout(() => cat.classList.remove("hop"), 550);
      return;
    }
    clickTimer = setTimeout(() => { clickTimer = 0; promptOpen ? closePrompt() : openPrompt(); }, 260);
  });
  bubble.addEventListener("click", () => { dismiss(); window.pet.openSession(); });

  addEventListener("resize", () => { if (S) { clamp(); if (area() === "sit") { x = anchorX(); } if (area() !== "screen") y = floorY(); } });
  reduced.addEventListener("change", () => S && applySettings(S));

  window.pet.onNotify(notify);
  window.pet.onSettings(applySettings);
  window.pet.getSettings().then(applySettings);
  requestAnimationFrame(tick);
</script>
</body>
</html>
