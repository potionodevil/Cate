<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harness Pet</title>
<style>
  @font-face { font-family: "Silkscreen"; font-weight: 700; src: url(fonts/silkscreen-700.woff2) format("woff2"); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  #basket, #bunny { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
  #basket { z-index: 3; }
  .heart { position: absolute; left: 0; top: 0; color: #ff6f8a; font: 700 14px "Silkscreen", monospace; pointer-events: none; animation: rise 1.1s steps(8) forwards; }
  @keyframes rise { from { margin-top: 0; opacity: 1; } to { margin-top: -36px; opacity: 0; } }
  #cat, .pop { position: absolute; left: 0; top: 0; will-change: transform; }
  #cat { cursor: pointer; }
  #cat, #bunny, #basket { opacity: var(--pet-opacity, 1); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #cat.hop #flip { animation: hop .5s steps(7); }
  #cat.alert #flip { animation: hop .6s steps(7) 3; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } }

  /* pixel-style pop-ups: square corners, hard shadow, square tail */
  .pop {
    padding: 6px 10px; font: 700 12px/1.4 "Silkscreen", "Cascadia Mono", Consolas, monospace;
    background: #f4f6fb; color: #262a36; border: 3px solid #262a36; box-shadow: 4px 4px 0 rgba(38,42,54,.55);
  }
  .pop[hidden], #prompt[hidden] { display: none; }
  .pop::after { content: ""; position: absolute; left: var(--tail, 50%); width: 9px; height: 9px; margin-left: -6px;
    background: #f4f6fb; border: 3px solid #262a36; border-top: 0; border-left: 0; bottom: -11px; }
  .pop.below::after { bottom: auto; top: -11px; transform: rotate(180deg); }
  #bubble { max-width: 280px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow: visible; }
  #prompt { width: 340px; display: flex; flex-direction: column; gap: 6px; }
  #prompt label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  #prompt select, #prompt input {
    font: inherit; color: inherit; background: #fff; border: 2px solid #262a36; border-radius: 0; padding: 4px 6px; min-width: 0; outline: none;
  }
  #prompt select { flex: 1; }
  #prompt input:focus, #prompt select:focus { border-color: #4a84fe; box-shadow: 0 0 0 2px #cfe0ff; }
  #prompt .hint { font-size: 11px; font-weight: 400; opacity: .7; }
  #prompt .empty { font-weight: 400; }
  @media (prefers-reduced-motion: reduce) { #cat.hop #flip, #cat.alert #flip { animation: none; } }
</style>
</head>
<body>
<div id="bubble" class="pop" hidden role="status" aria-live="polite"></div>
<form id="prompt" class="pop" hidden aria-label="Neuer Prompt">
  <label>Prompt an <select id="target" aria-label="Ziel-Session"></select></label>
  <input id="text" type="text" autocomplete="off" spellcheck="false" placeholder="Neuer Prompt …" aria-label="Prompt" />
  <span class="hint">Enter sendet · Esc schließt</span>
  <span class="empty" id="empty" hidden>Keine laufende Session.</span>
</form>
<div id="tip" class="pop" hidden role="tooltip"></div>
<div id="bunny" hidden><canvas id="bunnyc"></canvas></div>
<div id="cat" aria-label="Harness-Katze"><div id="flip" style="width:100%;height:100%"><canvas id="sprite" width="32" height="24"></canvas></div></div>
<div id="basket"><canvas id="basketc"></canvas></div>
<script src="catFrames.js"></script>
<script>
  // Nur-Zwei-Angebote-Logik: type "bunny" = Hase als Haupttier (statt der Katze); Katze mit Begleiter sonst.
  const bunnyMain = () => S?.petType === "bunny";
  bunnyMainDesktopInit();
  function bunnyMainDesktopInit() {
    const area = document.createElement("div");
    area.id = "bunnyMain";
    area.setAttribute("aria-label", "Harness-Hase");
    area.hidden = true;
    area.append(document.createElement("canvas"));
    area.firstChild.id = "bunnymain";
    document.body.appendChild(area);
    const st = document.createElement("style");
    st.textContent = `#bunnyMain { position: absolute; left: 0; top: 0; will-change: transform; cursor: pointer; opacity: var(--pet-opacity, 1); z-index: 4; }
#bunnyMain canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
#bunnyMain.hop { animation: mainhop .5s steps(7) 1; }
@keyframes mainhop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } }
#bunnyMain[hidden] { display: none; }
/* alert ist für den Bunny bewusst rein klassenseitig (kein Animationsrule):
   JS positioniert das Element per style.transform, eine CSS-Animation darauf
   würde die Position während der Animation überschreiben. Der Selector steht
   trotzdem im Reduced-Motion-Block, falls später eine Alert-Animation kommt. */
@media (prefers-reduced-motion: reduce) { #bunnyMain.hop, #bunnyMain.alert { animation: none; } }`;
    document.head.appendChild(st);
  }
  const bunnyMainEl = () => $("bunnyMain");

  // ---- sprite: assets/catFrames.js (generated by scripts/make-cat.py), 32x24, faces right
  const { w: CW, h: CH, frames: FRAMES } = CAT;

  // props: draw a prop frame (rows of any width) into its own canvas, scaled by S.scale
  function paintProp(el, name, pal) {
    const rows = FRAMES[name], c = el.querySelector("canvas") || el;
    c.width = rows[0].length; c.height = rows.length;
    c.style.width = c.width * S.scale + "px"; c.style.height = c.height * S.scale + "px";
    const g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height);
    rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  }
  // one visiting animal (settings.companion): speed px/s, frame length ms, hop height / flutter in sprite px
  const MOVES = { bunny: { v: 70, ms: 260, hop: 3 }, mouse: { v: 120, ms: 110, hop: 0 }, bird: { v: 60, ms: 300, hop: 2 }, butterfly: { v: 45, ms: 160, hop: 0, fly: 10 } };
  let PROP = { y: "#ffd24a", c: "#e08a4c", o: "#2b2d3a",w: "#f4f1ec", g: "#cdc6bd", e: "#2b2d3a", p: "#f2a7b5", n: "#e8758c", u: "#8a5a2b", r: "#c68a4a" };

  const mix = (hex, to, t) => {
    const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
    const c = (s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
    return "#" + [16, 8, 0].map((s) => c(s).toString(16).padStart(2, "0")).join("");
  };

  // ---- state
  const $ = (id) => document.getElementById(id);
  const tip = $("tip"), cat = $("cat"), flip = $("flip"), bubble = $("bubble"), prompt = $("prompt"), canvas = $("sprite"), ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  let S = null, PAL = {}, W = 120, H = 80;
  let x = 0, y = 0, dir = 1, mode = "rest", tx = 0, ty = 0, restUntil = 0, bubbleUntil = 0, pending = 0, promptOpen = false;
  let bunnyLane = 0, bunnyY = 0, napPending = false, bunnyOn = false, bunnyLast = performance.now(), bunnyX = 0, bunnyDir = 1, bunnyStart = 0, bunnyNext = performance.now() + 15000, bunnyFrame = "";
  // Hase als Haupttier: eigener Wander-/Idle-Zustand neben dem Katzen-Zustand, exklusiv (beides nie gleichzeitig)
  let mX = 0, mY = 0, mDir = 1, mMode = "rest", mTx = 0, mTy = 0, mFrame = "", mLast = 0, mBlink = 0, mNextBlink = 0, mExercise = 0;
  let groomUntil = 0, sleepUntil = 0, groomAt = performance.now() + 6000, hoverCat = false, tipNext = 0, running = 0;
  // Warte-Erkennung: Anzahl der Sessions, die auf Eingabe warten (vom Main-Prozess).
  let waitingCount = 0;
  let cursor = null, cursorAt = 0;
  let last = performance.now(), lastKey = "", blinkUntil = 0, nextBlink = last + 2500;

  const area = () => (reduced.matches ? "sit" : S.area);
  const maxX = () => Math.max(0, innerWidth - W);
  const floorY = () => Math.max(0, innerHeight - H);
  const basketX = () => Math.max(0, maxX() - 24 * (S?.scale ?? 4) - 8);
  const basketW = () => FRAMES.basket[0].length * S.scale, basketH = () => FRAMES.basket.length * S.scale;
  const anchorX = () => ({ left: 12, center: maxX() / 2, right: maxX() - 12 })[S.anchor];

  function applySettings(next) {
    const firstTime = !S;
    const typeChanged = S && S.petType !== next.petType;
    S = next;
    PAL = { o: S.outline, w: S.fur, g: mix(S.fur, "#000000", 0.16), e: S.eyes, h: "#ffffff", p: "#e58aa0", n: "#e8758c", c: "#e08a4c", y: "#ffd24a", t: "#ff6f8a", k: "#e08a4c", z: "#8fb8ff", i: "#f2b24c", m: "#cfd2de" };
    PROP = { ...PROP, o: S.outline, c: "#e08a4c" }; // Begleittiere teilen Outline + Akzent mit der Katze (Audit P1.3)
    document.documentElement.style.setProperty("--pet-opacity", String((S.opacity ?? 100) / 100));
    if (!S.followCursor) cursorAt = 0;
    W = CW * S.scale; H = CH * S.scale;
    cat.style.width = W + "px"; cat.style.height = H + "px";
    lastKey = ""; mFrame = "";
    if (typeChanged) {
      // Nur-1-Angebote-Logik: im Hasen-Modus bleibt die Katze komplett versteckt (beides nie gleichzeitig)
      $("cat").hidden = bunnyMain();
      $("bunnyMain").hidden = !bunnyMain();
      // offene Begleiter-/Hasentypos zurücksetzen, sonst wartet ein Geist auf seinen nächsten Auftritt
      if (!bunnyMain()) { mMode = "rest"; }
      else {
        bunnyMainEl().hidden = false;
        if (firstTime || !mLast) { mX = x; mY = floorY(); } // Start an der sonstigen Katzenposition
        mMode = "rest"; restUntil = performance.now() + 600;
      }
    }
    if (typeChanged && bunnyMain()) { mMode = "rest"; restUntil = performance.now() + 600; }
    if (firstTime) { x = anchorX(); y = floorY(); if (bunnyMain()) { mX = x; mY = y; } }
    if (bunnyMain() && !typeChanged && !firstTime) { mX = Math.min(mX ?? 0, maxX()); mY = floorY(); }
    paintProp($("basket"), "basket", PROP); bunnyOn = false; $("bunny").hidden = true; bunnyFrame = "";
    if (!bunnyMain()) bunnyMainEl().hidden = true;
    clamp();
    if (area() === "sit") { x = anchorX(); y = floorY(); mode = "rest"; }
    else if (area() === "floor") y = floorY();
    if (bunnyMain()) { // der Hase nutzt dieselben Regeln: floor/screen/sit
      if (area() === "sit") { mMode = "rest"; mX = anchorX(); mY = floorY(); }
      else if (area() === "floor") mY = floorY();
    }
    pickTarget(true);
  }

  function clamp() { x = Math.min(Math.max(0, x), maxX()); y = Math.min(Math.max(0, y), floorY()); }

  function pickTarget(soon) {
    if (area() === "sit") { mode = "rest"; restUntil = Infinity; return; }
    tx = Math.random() * maxX();
    ty = area() === "screen" && Math.random() < 0.45 ? Math.random() * floorY() : floorY();
    mode = "rest";
    restUntil = performance.now() + (soon ? 600 : 2000 + Math.random() * 4000);
  }

  function holding() { return promptOpen || bubbleUntil > 0; }

  // ---- draw
  function draw(name) {
    ctx.clearRect(0, 0, CW, CH);
    FRAMES[name].forEach((row, yy) => [...row].forEach((c, xx) => {
      if (c === ".") return;
      ctx.fillStyle = PAL[c];
      ctx.fillRect(xx, yy, 1, 1);
    }));
  }

  function place(el, preferAbove, centerX, edgeY, gap) {
    const w = el.offsetWidth, h = el.offsetHeight;
    const left = Math.min(Math.max(4, centerX - w / 2), Math.max(4, innerWidth - w - 8));
    const above = edgeY.top - h - gap >= 4 || !preferAbove;
    const top = above ? edgeY.top - h - gap : edgeY.bottom + gap;
    el.classList.toggle("below", !above);
    el.style.setProperty("--tail", Math.min(Math.max(14, centerX - left), w - 14) + "px");
    el.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
  }

  function tick(t) {
    const dt = Math.min(0.1, (t - last) / 1000);
    last = t;
    if (S) {
      const isBunny = bunnyMain();
      bunnyMainEl().hidden = !isBunny;
      if (isBunny) {
        if (bubbleUntil && t > bubbleUntil) dismiss();
        updateBunnyMain(t);
        if (!bubble.hidden) place(bubble, true, mX + (FRAMES.bunnyA[0].length * S.scale) / 2, { top: mY - 40, bottom: mY + FRAMES.bunnyA.length * S.scale }, 12);
        if (!prompt.hidden) place(prompt, true, mX + (FRAMES.bunnyA[0].length * S.scale) / 2, { top: mY - 40, bottom: mY + FRAMES.bunnyA.length * S.scale }, 12);
        const showTip = hoverCat && !holding();
        if (showTip && t > tipNext) { tipNext = t + 1000; refreshTip(); }
        tip.hidden = !showTip;
        if (showTip) place(tip, true, mX + (FRAMES.bunnyA[0].length * S.scale) / 2, { top: mY - 40, bottom: mY + FRAMES.bunnyA.length * S.scale }, 12);
        requestAnimationFrame(tick);
        return;
      }
      // follow the mouse pointer (reported by the main process while it is over this display)
      if (S.followCursor && cursor && !holding() && area() !== "sit" && !napPending) {
        const fx = Math.min(Math.max(0, cursor.x - W / 2), maxX()), fy = area() === "screen" ? Math.min(Math.max(0, cursor.y - H / 2), floorY()) : floorY();
        if (Math.hypot(fx - x, fy - y) > W * 0.8) { tx = fx; ty = fy; mode = "walk"; groomUntil = sleepUntil = 0; }
        else if (mode === "walk") { mode = "rest"; restUntil = t + 600; }
        if (mode === "rest" && restUntil < t + 600) restUntil = t + 600;
      }
      if (!holding() && mode === "walk") {
        const dx = tx - x, dy = ty - y, dist = Math.hypot(dx, dy), step = S.speed * dt;
        if (dist <= step) { x = tx; y = ty; mode = "rest"; restUntil = t + 2000 + Math.random() * 4000; }
        else { x += (dx / dist) * step; y += (dy / dist) * step; if (Math.abs(dx) > 1) dir = dx < 0 ? -1 : 1; }
      } else if (!holding() && mode === "rest" && t > restUntil && !groomUntil && !sleepUntil) {
        mode = "walk";
      }
      if (bubbleUntil && t > bubbleUntil) dismiss();
      if (t > nextBlink) { blinkUntil = t + 140; nextBlink = t + 2500 + Math.random() * 3000; }

      const stepMs = Math.min(400, Math.max(80, 10400 / S.speed));
      if (napPending && mode === "rest" && Math.abs(x - (basketX() + (basketW() - W) / 2)) < 2) { napPending = false; sleepUntil = t + 9000; dir = -1; }
      if (holding() || reduced.matches) { groomUntil = sleepUntil = 0; napPending = false; }
      else if (mode !== "rest") groomUntil = sleepUntil = 0;
      if (!groomUntil && !sleepUntil && t > groomAt) {
        // idle: mostly groom, sometimes nap (only when no session is running)
        if (!running && Math.random() * 100 < (S.napChance ?? 40)) { napPending = true; tx = basketX() + (basketW() - W) / 2; ty = floorY(); mode = "walk"; } else groomUntil = t + 4500;
        groomAt = t + (S.groomEvery ?? 15) * 1000 * (0.7 + Math.random() * 0.6);
      }
      if (t > groomUntil) groomUntil = 0;
      if (t > sleepUntil) sleepUntil = 0;
      const wag = Math.floor(t / 700) % 3 === 0 ? "Tail" : "";
      const name = mode === "walk" && !holding() ? (Math.floor(t / stepMs) % 2 ? "walkB" : "walkA")
        : groomUntil ? (Math.floor(t / 320) % 2 ? "groomB" : "groomA")
        : sleepUntil ? "sleep" : hoverCat ? "sitBlink" : "sit" + wag;
      const blinking = name.startsWith("sit") && !name.endsWith("Blink") && t < blinkUntil;
      const key = name + blinking;
      if (key !== lastKey) { draw(blinking ? name + "Blink" : name); lastKey = key; }

      // basket sits on the floor line; bunny hops by now and then
      const bk = $("basket"), fy = Math.round(floorY() + H - basketH());
      bk.style.transform = `translate(${Math.round(basketX() / S.scale) * S.scale}px, ${fy}px)`;
      updateBunny(t);
      flip.style.transform = dir < 0 ? "scaleX(-1)" : "none";
      const sink = sleepUntil ? 5 * S.scale : 0; // nap: the cat settles behind the basket rim
      const sx = Math.round(x / S.scale) * S.scale, sy = Math.round(y / S.scale) * S.scale + sink; // snap to the sprite pixel grid: no shimmer between frames
      cat.style.transform = `translate(${sx}px, ${sy}px)`;
      const edge = { top: sy, bottom: sy + H }, cx = sx + W / 2;
      if (!bubble.hidden) place(bubble, true, cx, edge, 12);
      if (!prompt.hidden) place(prompt, true, cx, edge, 12);
      const showTip = hoverCat && !holding();
      if (showTip && t > tipNext) { tipNext = t + 1000; refreshTip(); }
      tip.hidden = !showTip;
      if (showTip) place(tip, true, cx, edge, 12);
    }
    requestAnimationFrame(tick);
  }

  // ---- bunny: crosses the floor every 40-80s; the cat sits up and watches it
  // Maus: wir merken uns, wo der Zeiger zuletzt war, damit das Tier ihn jagen kann
  let mouseX = -1, mouseY = -1, mouseAt = 0, petting = 0, heartAt = 0;
  document.addEventListener("mousemove", (e) => { mouseX = e.clientX; mouseY = e.clientY; mouseAt = performance.now(); });

  /** Spielt den Besuch des Tieres: läuft durchs Bild, jagt den Mauszeiger, leckt am offenen Eingabefeld und lässt sich streicheln. */
  function updateBunny(t) {
    const b = $("bunny"), dt = Math.min(0.1, (t - bunnyLast) / 1000), m = MOVES[S.companion];
    bunnyLast = t;
    if (!m || reduced.matches) { b.hidden = true; bunnyOn = false; return; }
    const area = S.companionArea || "floor", sprite = FRAMES[S.companion + "A"], bh = sprite.length * S.scale, bw = sprite[0].length * S.scale;
    const laneY = area === "top" ? 8 : area === "screen" ? bunnyLane : floorY() + H - bh;
    if (!bunnyOn) {
      if (t < bunnyNext) return;
      bunnyOn = true; bunnyDir = Math.random() < 0.5 ? 1 : -1; bunnyX = bunnyDir > 0 ? -60 : innerWidth + 60; bunnyStart = t;
      bunnyLane = Math.random() * Math.max(0, floorY() - bh);
      bunnyY = area === "screen" ? bunnyLane : area === "top" ? 8 : floorY() + H - bh;
    }
    // Ziel: offenes Eingabefeld (lecken) > Mauszeiger (jagen) > einfach weiterlaufen
    const pr = prompt.hidden ? null : prompt.getBoundingClientRect();
    const chasing = !pr && petting <= t && t - mouseAt < 2500 && mouseX >= 0;
    let licking = false, moving = true;
    if (petting > t) moving = false;
    else if (pr) {
      const tx2 = pr.left - bw - 4, ty2 = pr.top + pr.height / 2 - bh / 2;
      if (Math.abs(bunnyX - tx2) > 6 || Math.abs(bunnyY - ty2) > 6) {
        bunnyDir = tx2 > bunnyX ? 1 : -1;
        bunnyX += Math.sign(tx2 - bunnyX) * Math.min(Math.abs(tx2 - bunnyX), m.v * 1.6 * dt);
        bunnyY += Math.sign(ty2 - bunnyY) * Math.min(Math.abs(ty2 - bunnyY), m.v * 1.6 * dt);
      } else { licking = true; moving = false; bunnyDir = 1; }
    } else if (chasing) {
      const dx = mouseX - (bunnyX + bw / 2), dy = (area === "screen" ? mouseY - bh / 2 : laneY) - bunnyY;
      if (Math.abs(dx) > 24 || Math.abs(dy) > 24) {
        bunnyDir = dx > 0 ? 1 : -1;
        bunnyX += Math.sign(dx) * Math.min(Math.abs(dx), m.v * 1.8 * dt);
        bunnyY += Math.sign(dy) * Math.min(Math.abs(dy), m.v * 1.8 * dt);
      } else moving = false; // am Zeiger angekommen: hüpft auf der Stelle
    } else {
      bunnyX += bunnyDir * m.v * dt;
      bunnyY += Math.sign(laneY - bunnyY) * Math.min(Math.abs(laneY - bunnyY), 60 * dt);
    }
    if (bunnyX < -80 || bunnyX > innerWidth + 80) { bunnyOn = false; b.hidden = true; bunnyNext = t + 40000 + Math.random() * 40000; return; }
    b.hidden = false;
    const ms = licking ? 420 : moving ? m.ms : chasing ? 150 : m.ms * 2;
    const second = ((t - bunnyStart) / ms) % 2 > 1, name = S.companion + (second ? "B" : "A");
    if (bunnyFrame !== name) { bunnyFrame = name; paintProp(b, name, PROP); }
    const lift = (second && moving ? m.hop : 0) * S.scale + (m.fly ? (m.fly + 4 * Math.sin(t / 400)) * S.scale : 0);
    b.style.transform = `translate(${Math.round(bunnyX / S.scale) * S.scale}px, ${Math.round(bunnyY - lift)}px)${bunnyDir < 0 ? " scaleX(-1)" : ""}`;
    // Streicheln: Herzchen steigen auf, solange der Zeiger auf dem Tier liegt
    if (petting > t && t > heartAt) { heartAt = t + 450; spawnHeart(bunnyX + bw / 2, bunnyY - 4); }
    // die Katze schaut zu: kein Putzen/Schlafen, solange das Tier da ist
    if (mode === "rest" && !holding() && !napPending) { dir = bunnyX > x ? 1 : -1; groomUntil = sleepUntil = 0; groomAt = t + 6000; }
  }

  /** Lässt ein kleines Herz an einer Stelle aufsteigen (reine CSS-Animation, räumt sich selbst auf). */
  function spawnHeart(px, py) {
    const h = document.createElement("div");
    h.className = "heart"; h.textContent = "♥";
    h.style.transform = `translate(${Math.round(px)}px, ${Math.round(py)}px)`;
    document.body.append(h);
    setTimeout(() => h.remove(), 1100);
  }

  // ---- Hase als Haupttier: dieselben Freuden wie die Katze, aber mit den Bunny-Frames und den
  // Bunny-Farben aus der PROP-Palette. Beide Tiere teilen sich die Logik NICHT: der Hase hüpft
  // durchs Bild, macht Pause/Übung und lässt sich anklicken wie die Katze — exklusiv (nie beide).
  function updateBunnyMain(t) {
    const b = bunnyMainEl();
    const dt = Math.min(0.1, (t - (mLast || t)) / 1000);
    mLast = t;
    if (!mX && !mY) { mX = x || anchorX(); mY = floorY(); } // erster Start: an der Startposition der Katze
    const BW = FRAMES.bunnyA[0].length * S.scale, BH = FRAMES.bunnyA.length * S.scale;
    if (holding()) { b.hidden = false; return; } // Prompt/Bubble: Hase friert ein, Elemente bleiben bedienbar
    if (S.followCursor && cursor) { // Dem Mauszeiger folgen, wie die Katze es tut
      const fx = Math.min(Math.max(0, cursor.x - BW / 2), maxX()), fy = area() === "screen" ? Math.min(Math.max(0, cursor.y - BH / 2), floorY()) : floorY();
      if (Math.hypot(fx - mX, fy - mY) > 80) { mTx = fx; mTy = fy; mMode = "walk"; }
      else if (mMode === "walk") { mMode = "rest"; restUntil = t + 600; }
    }
    if (mMode === "rest" && t > restUntil) { mTx = Math.random() * maxX(); mTy = area() === "screen" && Math.random() < 0.45 ? Math.random() * floorY() : floorY(); mMode = "walk"; }
    if (mMode === "walk") {
      const dx = mTx - mX, dy = mTy - mY, dist = Math.hypot(dx, dy), step = (S.speed ?? 52) * 1.3 * dt;
      if (dist <= step) { mX = mTx; mY = mTy; mMode = "rest"; restUntil = t + 2000 + Math.random() * 4000; }
      else { mX += (dx / dist) * step; mY += (dy / dist) * step; if (Math.abs(dx) > 1) mDir = dx < 0 ? -1 : 1; }
    }
    // Frame: A/B-Hüpfer im Lauf, sonst sitzt er (gleicher Frame, Echo wie die Katze)
    const stepMs = Math.min(400, Math.max(80, 10400 / S.speed));
    const name = mMode === "walk" ? (Math.floor(t / stepMs) % 2 ? "bunnyB" : "bunnyA") : "bunnyA";
    if (mFrame !== name) { mFrame = name; paintProp(b, name, PROP); }
    b.style.width = BW + "px"; b.style.height = BH + "px";
    b.style.transform = `translate(${Math.round(mX / S.scale) * S.scale}px, ${Math.round((mMode === "walk" ? mY - (Math.floor(t / stepMs) % 2 ? 3 : 0) * S.scale : mY) / 1)}px)${mDir < 0 ? " scaleX(-1)" : ""}`;
  }

  // ---- hover status: what the cat is doing + how many sessions are running/waiting
  async function refreshTip() {
    try { running = (await window.pet.sessions()).sessions.length; } catch { /* keep last count */ }
    const doing = bunnyMain() ? (mMode === "walk" ? "Hoppelt umher" : "Sitzt und wartet")
      : sleepUntil ? "Schläft · Zzz" : groomUntil ? "Putzt sich" : mode === "walk" ? "Streunt umher" : "Sitzt und wartet";
    tip.textContent = `${waitingCount ? waitingCount + " wartet auf dich · " : ""}${doing} · ${running ? `Fertig: ${running} Session${running > 1 ? "s" : ""}` : "Keine Session aktiv"}`;
  }

  // ---- bubble
  function say(text, seconds) {
    bubble.textContent = text;
    bubble.hidden = false;
    bubbleUntil = performance.now() + (seconds ?? S.bubbleSeconds) * 1000;
  }
  function notify(text) {
    if (!S) return;
    if (promptOpen) closePrompt();
    pending = bubbleUntil ? pending + 1 : 0;
    say(text + (pending ? `  (+${pending})` : ""));
    mode = "rest";
    const target = bunnyMain() ? bunnyMainEl() : cat;
    target.classList.remove("alert"); void target.offsetWidth; target.classList.add("alert");
    setTimeout(() => target.classList.remove("alert"), 1900);
  }
  function dismiss() {
    bubbleUntil = 0; pending = 0; bubble.hidden = true;
    restUntil = performance.now() + 800;
  }

  // ---- prompt
  async function openPrompt() {
    const { sessions, target } = await window.pet.sessions();
    const sel = $("target"), input = $("text");
    sel.replaceChildren(...sessions.map((s) => Object.assign(new Option(s.projectName ? `${s.name} · ${s.projectName}` : s.name, s.id), { selected: s.id === target })));
    const none = sessions.length === 0;
    $("empty").hidden = !none;
    sel.parentElement.hidden = input.hidden = prompt.querySelector(".hint").hidden = none;
    if (!bubble.hidden) dismiss();
    promptOpen = true; mode = "rest"; if (bunnyMain()) mMode = "rest";
    prompt.hidden = false;
    window.pet.focusable(true);
    setTimeout(() => input.focus(), 60);
  }
  function closePrompt() {
    if (!promptOpen) return;
    promptOpen = false; prompt.hidden = true; $("text").value = "";
    window.pet.focusable(false);
    restUntil = performance.now() + 800;
  }
  prompt.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("text").value.trim(), id = $("target").value, name = $("target").selectedOptions[0]?.text.split(" · ")[0];
    if (!text || !id) return;
    const res = await window.pet.send(id, text);
    closePrompt();
    say(res.ok ? `Gesendet an ${name}` : "Konnte nicht senden", 4);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePrompt(); });
  window.addEventListener("blur", () => closePrompt());

  // ---- mouse: the window is click-through, only the pet and its pop-ups catch the pointer
  let over = false;
  const inside = (el, e) => { if (el.hidden) return false; const r = el.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
  const setOver = (v) => { if (v !== over) { over = v; window.pet.hover(v); } };
  document.addEventListener("mousemove", (e) => {
    const onMain = !bunnyMainEl().hidden && inside(bunnyMainEl(), e);
    const onCat = bunnyMain() ? onMain : inside(cat, e); // im Hasen-Modus ist der Hase das erreichbare Tier
    if (onCat && !hoverCat) tipNext = 0;
    hoverCat = onCat;
    const onPet = bunnyOn && inside($("bunny"), e);
    if (onPet) petting = performance.now() + 700;
    setOver(onCat || onPet || inside(bubble, e) || inside(prompt, e));
  });
  document.addEventListener("mouseleave", () => { hoverCat = false; setOver(false); });

  // click = prompt box, double-click = open the project (auf dem gerade aktiven Tier)
  let clickTimer = 0;
  function petHit() { return bunnyMain() ? bunnyMainEl() : cat; }
  petHit().addEventListener("click", () => {
    if (clickTimer) {
      clearTimeout(clickTimer); clickTimer = 0;
      closePrompt();
      window.pet.openSession();
      const hopClass = bunnyMain() ? "hop-over" : "hop"; // der Hase hüpft über das CSS von #bunnyMain
      petHit().classList.remove(hopClass); void petHit().offsetWidth; petHit().classList.add(hopClass);
      setTimeout(() => petHit().classList.remove(hopClass), 550);
      return;
    }
    clickTimer = setTimeout(() => { clickTimer = 0; promptOpen ? closePrompt() : openPrompt(); }, 260);
  });
  bubble.addEventListener("click", () => { dismiss(); window.pet.openSession(); });

  addEventListener("resize", () => { if (S) { if (bunnyMain()) { mX = Math.min(mX, maxX()); mY = floorY(); } clamp(); if (area() === "sit") { x = anchorX(); } if (area() !== "screen") y = floorY(); } });
  reduced.addEventListener("change", () => S && applySettings(S));

  window.pet.onCursor((p) => { cursor = p; cursorAt = performance.now(); });
  window.pet.onNotify(notify);
  // Warte-Erkennung: Zähler merken; nur beim Übergang 0 -> N kurz aufmerksam
  // machen (stille alert-Animation, KEINE Bubble — das ist kein Fertig-Notify).
  window.pet.onWaiting((count) => {
    const wasIdle = waitingCount === 0;
    waitingCount = count;
    if (wasIdle && count > 0 && S && S.enabled) {
      const target = bunnyMain() ? bunnyMainEl() : cat;
      target.classList.remove("alert"); void target.offsetWidth; target.classList.add("alert");
      setTimeout(() => target.classList.remove("alert"), 1900);
    }
  });
  window.pet.onSettings(applySettings);
  window.pet.getSettings().then(applySettings);
  requestAnimationFrame(tick);
</script>
</body>
</html>
